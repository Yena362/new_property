<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="theme-color" content="#ffffff">
<title>신흥 부동산 매물 장부</title>
<link rel="icon" href="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHZpZXdCb3g9IjAgMCA2NCA2NCI+CiAgPHJlY3Qgd2lkdGg9IjY0IiBoZWlnaHQ9IjY0IiByeD0iMTQiIGZpbGw9IiMwMDcxZTMiLz4KICA8cGF0aCBkPSJNMTMgMzAuNSAzMiAxNWwxOSAxNS41VjUwYTIgMiAwIDAgMS0yIDJIMzhWMzcuNUgyNlY1MkgxNWEyIDIgMCAwIDEtMi0yeiIgZmlsbD0iI2ZmZiIvPgo8L3N2Zz4K" type="image/svg+xml">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* ==========================================================================
   신흥 부동산 매물 장부 — styles.css
   화면 색·간격·모양을 모두 이 파일에서 정합니다.
   맨 위 :root 값만 바꾸면 사이트 전체 분위기가 한 번에 바뀝니다.
   ========================================================================== */

:root{
  color-scheme: light;            /* 컴퓨터가 어두운 모드여도 화면은 흰색으로 */

  /* 바탕과 글자 */
  --bg:             #ffffff;
  --surface:        #ffffff;
  --surface-2:      #f7f7f9;
  --surface-sunken: #f4f4f7;
  --separator:      rgba(60,60,67,.14);
  --separator-firm: rgba(60,60,67,.24);
  --fill:           rgba(118,118,128,.09);
  --fill-strong:    rgba(118,118,128,.16);
  --label:          #1d1d1f;
  --label-2:        #6e6e73;
  --label-3:        #8e8e93;

  /* 강조색 */
  --tint:           #0071e3;
  --tint-press:     #0060c0;
  --on-tint:        #ffffff;
  --tint-wash:      rgba(0,113,227,.09);

  /* 상태색 */
  --green:          #1a7f37;
  --green-wash:     rgba(52,199,89,.15);
  --orange:         #9a5b00;
  --orange-wash:    rgba(255,149,0,.15);
  --gray:           #6e6e73;
  --gray-wash:      rgba(118,118,128,.13);
  --red:            #d70015;

  /* 유리 효과 상단바 */
  --glass:          rgba(255,255,255,.78);

  /* 모양 */
  --r-sm: 8px;
  --r-md: 12px;
  --r-lg: 18px;
  --r-xl: 24px;
  --shadow-1: 0 1px 2px rgba(0,0,0,.04), 0 1px 1px rgba(0,0,0,.03);
  --shadow-2: 0 4px 16px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.04);
  --shadow-3: 0 24px 64px rgba(0,0,0,.18), 0 2px 8px rgba(0,0,0,.08);

  /* 움직임 — 애플 시트 곡선 */
  --ease: cubic-bezier(.32,.72,0,1);
}

/* ---------- 기본 ---------- */
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  overflow-x:hidden;          /* 옆으로 밀리지 않게 */
  background:var(--bg);
  color:var(--label);
  font-family:-apple-system, BlinkMacSystemFont, "SF Pro Text", "Apple SD Gothic Neo",
              "Pretendard Variable", Pretendard, "Segoe UI", "Malgun Gothic", sans-serif;
  font-size:15px;
  line-height:1.5;
  letter-spacing:-.011em;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit; color:inherit; letter-spacing:inherit}
h1,h2,h3,h4,p,dl,dd{margin:0}
.hidden, [hidden]{display:none !important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.num{font-variant-numeric:tabular-nums; font-feature-settings:"tnum"}
:focus-visible{outline:3px solid color-mix(in srgb, var(--tint) 55%, transparent); outline-offset:2px; border-radius:6px}
svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 버튼 ---------- */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
  border:none; background:var(--fill); color:var(--label);
  padding:0 14px; height:34px; border-radius:999px;
  font-size:14px; font-weight:500; cursor:pointer; white-space:nowrap;
  transition:background .18s var(--ease), transform .12s var(--ease), opacity .18s;
}
.btn:hover{background:var(--fill-strong)}
.btn:active{transform:scale(.96)}
.btn.primary{background:var(--tint); color:var(--on-tint); font-weight:600}
.btn.primary:hover{background:var(--tint-press)}
.btn.quiet{background:transparent; color:var(--tint)}
.btn.quiet:hover{background:var(--fill)}
.btn.destructive{background:transparent; color:var(--red)}
.btn.destructive:hover{background:color-mix(in srgb, var(--red) 12%, transparent)}
.btn.icon-btn{width:34px; padding:0}
.btn svg{width:17px;height:17px}

/* ---------- 상단 바 ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:var(--glass);
  -webkit-backdrop-filter:saturate(180%) blur(20px);
  backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--separator);
}
.topbar-inner{
  max-width:1360px; margin:0 auto;
  display:flex; align-items:center; gap:16px;
  padding:10px 22px; padding-left:max(22px, env(safe-area-inset-left));
}
.brand{display:flex; align-items:center; gap:9px; min-width:0}
.brand-mark{width:26px;height:26px; fill:var(--tint); stroke:none; flex:none}
.brand-text{display:flex; flex-direction:column; line-height:1.15; min-width:0}
.brand-text b{font-size:15px; font-weight:600; letter-spacing:-.02em; white-space:nowrap}
.brand-text i{font-size:11.5px; font-style:normal; color:var(--label-3); white-space:nowrap}

.seg{
  position:relative; display:flex; margin:0 auto;
  background:var(--fill); border-radius:9px; padding:2px;
}
.seg-thumb{
  position:absolute; top:2px; left:2px; bottom:2px; width:calc(50% - 2px);
  background:var(--surface); border-radius:7px; box-shadow:var(--shadow-1);
  transition:transform .3s var(--ease);
}
.seg[data-i="1"] .seg-thumb{transform:translateX(100%)}
.seg-btn{
  position:relative; z-index:1; border:none; background:none; cursor:pointer;
  padding:5px 26px; font-size:13.5px; font-weight:500; color:var(--label-2);
  transition:color .2s;
}
.seg-btn[aria-selected="true"]{color:var(--label); font-weight:600}

.top-actions{display:flex; align-items:center; gap:8px; margin-left:auto}
.saved{font-size:12px; color:var(--label-3); opacity:0; transition:opacity .4s}
.saved.on{opacity:1}

/* ---------- 레이아웃 ---------- */
.layout{
  max-width:1360px; margin:0 auto;
  display:grid; grid-template-columns:216px minmax(0,1fr);
  gap:26px; padding:24px 22px 96px; align-items:start;
}
.layout > *{min-width:0}
.main{min-width:0}
.sidebar{position:sticky; top:80px; display:flex; flex-direction:column; gap:6px; min-width:0}
.side-title{
  font-size:11.5px; font-weight:600; color:var(--label-3);
  letter-spacing:.02em; padding:0 12px 6px;
}
.side-title.spaced{padding-top:20px}
.side-list{display:flex; flex-direction:column; gap:1px}
.side-item{
  display:flex; align-items:center; gap:10px;
  border:none; background:none; cursor:pointer; width:100%; text-align:left;
  padding:8px 12px; border-radius:9px; color:var(--label); font-size:14px;
  transition:background .15s;
}
.side-item:hover{background:var(--fill)}
.side-item[aria-current="true"]{background:var(--tint); color:var(--on-tint); font-weight:600}
.side-item svg{width:17px;height:17px; color:var(--label-3); flex:none}
.side-item[aria-current="true"] svg{color:var(--on-tint)}
.side-item .n{margin-left:auto; font-size:12.5px; color:var(--label-3); font-variant-numeric:tabular-nums}
.side-item[aria-current="true"] .n{color:var(--on-tint); opacity:.8}

.stats{display:flex; flex-direction:column; gap:1px}
.stat{display:flex; align-items:baseline; gap:8px; padding:6px 12px; border-radius:9px}
.stat dt{font-size:13.5px; color:var(--label-2)}
.stat dd{margin-left:auto; font-size:14px; font-weight:600; font-variant-numeric:tabular-nums}
.stat.is-green dd{color:var(--green)}
.stat.is-orange dd{color:var(--orange)}

/* ---------- 검색·필터 ---------- */
.toolbar{display:flex; flex-direction:column; gap:12px; margin-bottom:14px}
.searchwrap{position:relative; display:flex; align-items:center}
.search-ico{position:absolute; left:13px; color:var(--label-3); pointer-events:none}
.search{
  width:100%; height:40px; padding:0 62px 0 40px;
  background:var(--surface); border:1px solid var(--separator); border-radius:var(--r-md);
  box-shadow:var(--shadow-1); transition:border-color .18s, box-shadow .18s;
}
.search::placeholder{color:var(--label-3)}
.search:focus{outline:none; border-color:var(--tint); box-shadow:0 0 0 4px var(--tint-wash)}
.search::-webkit-search-cancel-button{-webkit-appearance:none}
.kbd{
  position:absolute; right:10px; font-size:11.5px; color:var(--label-3);
  background:var(--fill); border-radius:6px; padding:2px 7px; pointer-events:none;
}
.search:focus ~ .kbd{opacity:0}

.filters{display:flex; align-items:center; gap:6px; flex-wrap:wrap}
.chips{display:flex; gap:6px; flex-wrap:wrap}
.chip{
  border:none; background:var(--fill); color:var(--label-2);
  height:30px; padding:0 13px; border-radius:999px; font-size:13.5px; cursor:pointer;
  transition:background .16s, color .16s, transform .12s var(--ease);
}
.chip:hover{background:var(--fill-strong)}
.chip:active{transform:scale(.95)}
.chip[aria-pressed="true"]{background:var(--tint); color:var(--on-tint); font-weight:600}
.chip-div{width:1px; height:18px; background:var(--separator-firm); margin:0 4px}
.sortwrap{margin-left:auto; position:relative}
.sortwrap select{
  height:30px; border:none; background:var(--fill); color:var(--label-2);
  border-radius:999px; padding:0 10px; font-size:13.5px; cursor:pointer;
}
.resultline{font-size:12.5px; color:var(--label-3); padding:0 4px 8px}

/* ---------- 목록 카드 ---------- */
.card{
  background:var(--surface); border:1px solid var(--separator);
  border-radius:var(--r-lg); box-shadow:var(--shadow-2); overflow:hidden;
}
.tablewrap{overflow-x:auto; -webkit-overflow-scrolling:touch}
table{border-collapse:collapse; width:100%; min-width:880px}
thead th{
  position:sticky; top:0; z-index:2;
  text-align:left; font-size:12px; font-weight:600; color:var(--label-3);
  padding:11px 16px; background:var(--surface-2);
  border-bottom:1px solid var(--separator); white-space:nowrap;
}
thead th.sortable{cursor:pointer; user-select:none}
thead th.sortable:hover{color:var(--label)}
thead th .caret{font-size:10px; opacity:.9; margin-left:3px}
tbody td{padding:13px 16px; border-bottom:1px solid var(--separator); vertical-align:middle}
tbody tr{cursor:pointer; transition:background .12s}
tbody tr:hover{background:var(--surface-2)}
tbody tr[data-active="1"]{background:var(--tint-wash)}
tbody tr:last-child td{border-bottom:none}
.t-main{font-weight:600; letter-spacing:-.015em}
.t-sub{color:var(--label-2); font-size:12.5px; margin-top:1px}
.t-code{color:var(--label-3); font-size:12.5px; font-variant-numeric:tabular-nums}
.money{font-weight:600; font-variant-numeric:tabular-nums; letter-spacing:-.02em}

.tag{
  display:inline-block; padding:3px 9px; border-radius:7px;
  background:var(--fill); font-size:12.5px; font-weight:500; white-space:nowrap;
}
.badge{
  display:inline-flex; align-items:center; gap:5px; padding:3px 10px 3px 8px;
  border-radius:999px; font-size:12.5px; font-weight:600; white-space:nowrap;
}
.badge::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}
.badge.b-go{background:var(--green-wash); color:var(--green)}
.badge.b-hold{background:var(--orange-wash); color:var(--orange)}
.badge.b-done{background:var(--gray-wash); color:var(--gray)}

/* 줄 끝 삭제(✕) 단추 */
.rowact{width:46px; text-align:right; padding-left:0 !important}
.xbtn{
  width:26px; height:26px; border:none; border-radius:50%; background:transparent;
  color:var(--label-3); cursor:pointer; display:inline-flex; align-items:center; justify-content:center;
  opacity:0; transition:opacity .15s, background .15s, color .15s; flex:none;
}
tbody tr:hover .xbtn, .row:hover .xbtn, .xbtn:focus-visible{opacity:1}
.xbtn:hover{background:color-mix(in srgb, var(--red) 12%, transparent); color:var(--red)}
.xbtn svg{width:15px; height:15px; stroke-width:2.1}
@media (hover:none){ .xbtn{opacity:1} }

/* 맨 아래 '+ 추가' 줄 */
.addrow td{padding:0 !important; border-bottom:none !important}
.addbtn{
  display:flex; align-items:center; gap:7px; width:100%;
  border:none; background:transparent; color:var(--tint);
  padding:12px 16px; font-size:14px; font-weight:600; cursor:pointer;
  transition:background .15s;
}
.addbtn:hover{background:var(--tint-wash)}
.addbtn svg{width:17px; height:17px; stroke-width:2}
.rows > .addbtn{border-top:1px solid var(--separator)}

/* 떠 있는 + 단추 (좁은 화면) */
.fab{
  position:fixed; right:18px; bottom:calc(18px + env(safe-area-inset-bottom));
  width:54px; height:54px; border:none; border-radius:50%;
  background:var(--tint); color:var(--on-tint); box-shadow:var(--shadow-2);
  cursor:pointer; display:none; align-items:center; justify-content:center; z-index:35;
  transition:transform .12s var(--ease);
}
.fab:active{transform:scale(.93)}
.fab svg{width:24px; height:24px; stroke-width:2.2}

/* 모바일 카드 목록 */
.rows{display:none}
.row{
  display:flex; gap:10px; align-items:center; width:100%; text-align:left;
  border:none; background:none; padding:14px 16px; cursor:pointer;
  border-bottom:1px solid var(--separator);
}
.row:last-of-type{border-bottom:none}
.row:active{background:var(--surface-2)}
.row-body{flex:1; min-width:0; align-self:flex-start}
.row-top{display:flex; align-items:center; gap:7px; flex-wrap:wrap}
.row-money{margin-top:3px}
.row-meta{color:var(--label-2); font-size:12.5px; margin-top:2px}
.chev{color:var(--label-3); align-self:center; flex:none}

/* 빈 화면 */
.empty{padding:64px 24px; text-align:center}
.empty svg{width:38px;height:38px; color:var(--label-3); margin-bottom:12px}
.empty h4{font-size:17px; font-weight:600; margin-bottom:4px}
.empty p{color:var(--label-2); font-size:14px; margin-bottom:16px}

/* 예시 안내 */
.notice{
  display:flex; align-items:center; gap:12px; flex-wrap:wrap;
  background:var(--orange-wash); color:var(--orange);
  padding:11px 16px; border-radius:var(--r-md); margin-bottom:14px; font-size:13.5px;
}
.notice b{font-weight:600}
.notice .btn{margin-left:auto; background:color-mix(in srgb, var(--orange) 18%, transparent); color:var(--orange)}

/* ---------- 상세 패널 ---------- */
.scrim{position:fixed; inset:0; background:rgba(0,0,0,.28); z-index:40; opacity:0; transition:opacity .3s var(--ease)}
.scrim.on{opacity:1}
.detail{
  position:fixed; top:0; right:0; height:100dvh; width:min(440px,100%); z-index:50;
  background:var(--surface); border-left:1px solid var(--separator);
  display:flex; flex-direction:column;
  transform:translateX(101%); box-shadow:var(--shadow-3);
  transition:transform .38s var(--ease);
}
.detail.closed{display:none}     /* 닫혀 있을 땐 아예 없애서 가로 스크롤이 생기지 않게 */
.detail.on{transform:none}
.detail-head{display:flex; align-items:flex-start; gap:12px; padding:16px 20px 12px; border-bottom:1px solid var(--separator)}
.detail-title{min-width:0}
.detail-title h3{font-size:20px; font-weight:600; letter-spacing:-.02em}
.detail-title p{font-size:13px; color:var(--label-3); margin-top:2px}
.detail-body{flex:1; overflow-y:auto; padding:18px 20px 26px; -webkit-overflow-scrolling:touch}
.detail-foot{display:flex; gap:8px; padding:12px 20px; padding-bottom:max(12px, env(safe-area-inset-bottom)); border-top:1px solid var(--separator)}
.detail-foot .destructive{margin-left:auto}

.hero-money{font-size:30px; font-weight:600; letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.hero-money small{font-size:15px; font-weight:500; color:var(--label-3); margin-left:4px}
.hero-sub{color:var(--label-2); font-size:13.5px; margin-top:2px}

.statusbar{display:flex; gap:6px; margin:16px 0 4px}
.statusbar .chip{flex:1}

.group{margin-top:22px}
.group h4{font-size:12px; font-weight:600; color:var(--label-3); padding:0 4px 7px}
.rowsbox{background:var(--surface-2); border:1px solid var(--separator); border-radius:var(--r-md); overflow:hidden}
.kv{display:flex; gap:14px; padding:10px 14px; border-bottom:1px solid var(--separator); font-size:14px}
.kv:last-child{border-bottom:none}
.kv dt{color:var(--label-2); flex:none; width:82px}
.kv dd{flex:1; text-align:right; word-break:break-word}
.kv dd.left{text-align:left; white-space:pre-wrap}
.kv .copy{
  border:none; background:none; color:var(--tint); cursor:pointer; padding:0 0 0 8px; font-size:13px;
}

/* ---------- 등록·수정 시트 ---------- */
.modal{
  position:fixed; inset:0; z-index:60; display:flex; align-items:flex-end; justify-content:center;
  background:rgba(0,0,0,.35); padding:0;
  opacity:0; transition:opacity .28s var(--ease);
}
.modal.on{opacity:1}
@media (min-width:721px){ .modal{align-items:center; padding:28px 20px; overflow-y:auto} }
.sheet{
  background:var(--surface); width:min(760px,100%);
  border-radius:var(--r-xl) var(--r-xl) 0 0; box-shadow:var(--shadow-3);
  max-height:92dvh; display:flex; flex-direction:column;
  transform:translateY(28px); transition:transform .34s var(--ease);
}
.modal.on .sheet{transform:none}
@media (min-width:721px){ .sheet{border-radius:var(--r-xl); margin:auto; max-height:none} }
.sheet-head{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:10px;
  padding:14px 16px; border-bottom:1px solid var(--separator);
}
.sheet-head h3{font-size:16px; font-weight:600; text-align:center; white-space:nowrap}
.sheet-head .btn.quiet{justify-self:start}
.sheet-head-right{display:flex; gap:8px; justify-self:end}
.sheet-body{padding:6px 20px 26px; overflow-y:auto}

.fset{margin-top:20px}
.fset h4{font-size:12px; font-weight:600; color:var(--label-3); padding:0 4px 8px}
.grid{display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:14px}
.f{display:flex; flex-direction:column; gap:5px}
.f.w2{grid-column:span 2}
.f.w4{grid-column:span 4}
.f label{font-size:12.5px; color:var(--label-2); padding-left:2px}
.f input, .f select, .f textarea{
  width:100%; height:38px; padding:0 12px;
  background:var(--surface-sunken); border:1px solid transparent; border-radius:10px;
  transition:border-color .16s, background .16s, box-shadow .16s;
}
.f textarea{height:auto; min-height:84px; padding:10px 12px; resize:vertical; font-family:inherit; line-height:1.5}
.f input:focus, .f select:focus, .f textarea:focus{
  outline:none; background:var(--surface); border-color:var(--tint); box-shadow:0 0 0 4px var(--tint-wash);
}
.f .hint{font-size:11.5px; color:var(--label-3); padding-left:2px}
.picks{display:flex; flex-wrap:wrap; gap:6px}
.picks label{
  display:inline-flex; align-items:center; gap:6px; cursor:pointer;
  background:var(--fill); border-radius:999px; padding:7px 14px; font-size:13.5px; color:var(--label-2);
  transition:background .16s, color .16s;
}
.picks label:has(input:checked){background:var(--tint); color:var(--on-tint); font-weight:600}
.picks input{position:absolute; opacity:0; width:0; height:0}

/* ---------- 알림 ---------- */
.toast{
  position:fixed; left:50%; bottom:26px; transform:translate(-50%, 16px);
  display:flex; align-items:center; gap:14px; z-index:80;
  background:rgba(28,28,30,.94); color:#fff;
  -webkit-backdrop-filter:blur(16px); backdrop-filter:blur(16px);
  padding:11px 18px; border-radius:999px; font-size:13.5px; box-shadow:var(--shadow-2);
  opacity:0; pointer-events:none; transition:opacity .24s var(--ease), transform .24s var(--ease);
  max-width:calc(100vw - 32px);
}
.toast.on{opacity:1; transform:translate(-50%,0); pointer-events:auto}
.toast-action{border:none; background:none; color:#4da3ff; font-weight:600; cursor:pointer; padding:0; white-space:nowrap}

/* ---------- 중간 너비 (태블릿) ---------- */
@media (max-width:1000px){
  .layout{grid-template-columns:1fr; gap:16px; padding:16px 16px 96px}
  .sidebar{position:static; flex-direction:column}
  .side-list{flex-direction:row; overflow-x:auto; gap:6px; padding-bottom:4px; scrollbar-width:none}
  .side-list::-webkit-scrollbar{display:none}
  .side-item{width:auto; white-space:nowrap; background:var(--surface); border:1px solid var(--separator)}
  .side-item[aria-current="true"]{border-color:var(--tint)}
  .stats{flex-direction:row; flex-wrap:wrap; gap:6px}
  .stat{background:var(--surface); border:1px solid var(--separator); padding:6px 12px}
  .stat dd{margin-left:6px}
}

@media (max-width:720px){
  .grid{grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px}
  .f.w4{grid-column:span 2}
  .sheet-body{padding:6px 16px 24px}
  .toast{bottom:18px; left:16px; right:16px; transform:translateY(16px); justify-content:space-between}
  .toast.on{transform:none}
  /* 손가락으로 누르기 편한 크기 */
  .f input, .f select, .f textarea{height:42px; font-size:16px}   /* 16px 이상이라야 아이폰에서 확대되지 않습니다 */
  .f textarea{height:auto; min-height:88px}
  .picks label{padding:9px 15px; font-size:14px}
  .sheet-head{padding:12px}
  .sheet-head h3{font-size:15px}
  #fDraft{padding:0 11px; font-size:13px}
  .search{font-size:16px}
  .detail-foot .btn, .sheet-head .btn{height:36px}

  /* 상단 바 */
  .topbar-inner{flex-wrap:wrap; gap:8px; padding:8px 12px}
  .brand-text i{display:none}
  .brand-mark{width:23px; height:23px}
  .brand-text b{font-size:14.5px}
  .seg{order:3; width:100%; margin:0}
  .seg-btn{flex:1; padding:7px 0; font-size:14px}
  .top-actions{margin-left:auto; gap:6px}
  .top-actions .btn span{display:none}
  .top-actions .btn{width:32px; height:32px; padding:0}
  .top-actions .btn.primary{width:auto; padding:0 13px}
  .top-actions .btn.primary span{display:inline}
  .saved, .kbd{display:none}

  /* 본문 — 목록이 빨리 나오도록 위쪽을 최대한 줄입니다 */
  .layout{grid-template-columns:1fr; gap:10px; padding:12px 0 96px}
  .sidebar{padding:0 12px; gap:8px}
  .main{padding:0 12px}
  .side-title{display:none}

  /* 종류 칩: 화면 끝까지 밀어서 넘겨 보기 */
  .side-list{margin:0 -12px; padding:1px 12px}
  .side-item{width:auto; white-space:nowrap; background:var(--surface); border:1px solid var(--separator); padding:7px 13px}
  .side-item[aria-current="true"]{border-color:var(--tint)}
  .side-item svg{display:none}

  /* '한눈에'는 한 줄짜리 요약으로 */
  .stats{
    flex-direction:row; flex-wrap:nowrap; gap:0; overflow-x:auto;
    margin:0 -12px; padding:0 12px; scrollbar-width:none;
  }
  .stats::-webkit-scrollbar{display:none}
  .stat{
    background:none; border:none; padding:0; margin-right:14px;
    font-size:12.5px; white-space:nowrap;
  }
  .stat dt{font-size:12.5px; color:var(--label-3)}
  .stat dd{margin-left:5px; font-size:12.5px}

  /* 휴대폰에서는 파일 직접 저장이 안 되므로 감춥니다 */
  .filebar{display:none}

  /* 안내 줄 압축 */
  .notice, .draftbar{padding:9px 12px; font-size:12.5px; gap:7px; margin-bottom:10px}
  .notice .btn, .draftbar .btn{height:28px; font-size:12px; padding:0 11px}
  .hide-sm{display:none}

  /* 검색·필터 한 줄로 넘겨 보기 */
  .toolbar{gap:8px; margin-bottom:10px}
  .search{height:38px}
  .filters{
    flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none;
    margin:0 -12px; padding:0 12px 2px;
  }
  .filters::-webkit-scrollbar{display:none}
  .chips{flex-wrap:nowrap}
  .chip{height:29px}
  .sortwrap{margin-left:0; flex:none}
  .sortwrap select{width:auto}
  .resultline{padding:0 2px 6px}

  /* 목록 */
  .card{border-radius:14px}
  .tablewrap{display:none}
  .rows{display:block}
  .row{padding:13px 14px}

  /* 상세·등록창 */
  .detail{width:100%; border-left:none}
  .detail-body{padding:16px 16px 24px}
  .kv dt{width:74px}
  .fab{display:flex}
}

@media (max-width:380px){
  .top-actions .btn.primary span{display:none}
  .top-actions .btn.primary{width:32px; padding:0}
}

@media (prefers-reduced-motion: reduce){
  *{transition:none !important; animation:none !important}
}

/* ---------- 인쇄 ---------- */
@media print{
  .topbar,.sidebar,.toolbar,.detail,.scrim,.modal,.toast,.notice,.chev,
  .fab,.filebar,.draftbar,.xbtn,.addrow,.addbtn,.rowact{display:none !important}
  .layout{display:block; padding:0; max-width:none}
  .card{border:none; box-shadow:none}
  table{min-width:0; font-size:11px}
  thead th{position:static; background:none; border-bottom:1px solid #999}
  tbody td{padding:6px 8px; border-bottom:1px solid #ddd}
  .rows{display:none}
  .tablewrap{display:block !important; overflow:visible}
}

/* ---------- 엑셀 파일 저장 상태 바 ---------- */
.filebar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--surface); border:1px solid var(--separator); border-radius:var(--r-md);
  box-shadow:var(--shadow-1); padding:11px 14px; margin-bottom:12px; font-size:13.5px;
}
.filebar svg{width:17px;height:17px; color:var(--label-3); flex:none}
.filebar.linked svg{color:var(--green)}
.filebar b{font-weight:600}
.filebar .dim{color:var(--label-2)}
.filebar .grow{flex:1; min-width:120px}
.filebar .acts{display:flex; gap:6px; margin-left:auto}
.filebar .btn{height:30px; font-size:13px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--green);flex:none}
.dot.warn{background:var(--orange)}

/* ---------- 임시저장 ---------- */
.draftbar{
  display:flex; align-items:center; gap:10px; flex-wrap:wrap;
  background:var(--tint-wash); border:1px solid transparent; border-radius:var(--r-md);
  padding:11px 14px; margin-bottom:12px; font-size:13.5px; color:var(--tint-press);
}
.draftbar svg{width:17px;height:17px; flex:none}
.draftbar b{font-weight:600}
.draftbar .acts{display:flex; gap:6px; margin-left:auto}
.draftbar .btn{height:30px; font-size:13px; background:rgba(255,255,255,.7); color:var(--tint-press)}
.draftbar .btn.primary{background:var(--tint); color:var(--on-tint)}
.draftnote{
  display:flex; align-items:center; gap:8px; margin-top:14px;
  background:var(--tint-wash); color:var(--tint-press);
  border-radius:10px; padding:9px 13px; font-size:13px;
}
.draftnote button{
  margin-left:auto; border:none; background:none; color:var(--tint);
  font-weight:600; cursor:pointer; font-size:13px; padding:0;
}

/* ---------- 좁은 화면 마무리 (뒤에 오는 규칙이라 우선합니다) ---------- */
@media (max-width:720px){
  .filebar{display:none}                 /* 휴대폰에서는 파일 직접 저장이 불가 */
  .main, .sidebar{overflow-x:clip}       /* 옆으로 넘겨보는 줄이 페이지를 밀지 않도록 */
  .filters > *{flex:none}
  .chips{flex-wrap:nowrap; flex:none}
  .chip{flex:none; white-space:nowrap}
  .draftbar, .notice{flex-wrap:wrap; row-gap:8px}
  .draftbar b{overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:55vw}
  .draftbar > span, .notice > span{min-width:0}
  .draftbar .acts, .notice .btn{margin-left:auto}
}

/* ---------- 오늘 챙길 일 ---------- */
.todo{background:var(--surface); border:1px solid var(--separator); border-radius:var(--r-lg); box-shadow:var(--shadow-1); margin-bottom:14px; overflow:hidden}
.todo-head{display:flex; align-items:center; gap:8px; width:100%; border:none; background:none; cursor:pointer; padding:12px 16px; text-align:left; font-size:14.5px}
.todo-head b{font-weight:600}
.todo-head svg{color:var(--tint)}
.todo-head .cnt{background:var(--red); color:#fff; border-radius:999px; font-size:12px; font-weight:600; padding:1px 8px}
.todo-head .cnt.zero{background:var(--fill); color:var(--label-3)}
.todo-head .chev-d{margin-left:auto; display:inline-flex; color:var(--label-3); transition:transform .2s var(--ease)}
.todo.open .chev-d{transform:rotate(180deg)}
.todo-list{border-top:1px solid var(--separator)}
.todo-item{display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; cursor:pointer; text-align:left; padding:10px 16px; border-bottom:1px solid var(--separator); font-size:14px}
.todo-item:last-child{border-bottom:none}
.todo-item:hover{background:var(--surface-2)}
.todo-kind{flex:none; font-size:12px; font-weight:600; padding:2px 0; border-radius:6px; width:46px; text-align:center}
.k-call{background:var(--tint-wash); color:var(--tint-press)}
.k-money{background:var(--green-wash); color:var(--green)}
.k-warn{background:var(--orange-wash); color:var(--orange)}
.k-late{background:color-mix(in srgb, var(--red) 12%, transparent); color:var(--red)}
.todo-text{flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.todo-when{flex:none; font-size:12.5px; color:var(--label-3); font-variant-numeric:tabular-nums}
.todo-when.late{color:var(--red); font-weight:600}
.todo-empty{padding:12px 16px; color:var(--label-3); font-size:13.5px}

/* ---------- 상세: 빠른 동작·맞춤·기록 ---------- */
a.btn{text-decoration:none}
.quickacts{display:flex; gap:8px; margin-top:14px}
.quickacts .btn{flex:1; height:38px}
.group-head{display:flex; align-items:center; gap:8px; padding:0 4px 7px}
.group-head h4{padding:0}
.group-head .btn{margin-left:auto; height:26px; font-size:12.5px; padding:0 10px}
.match{display:flex; align-items:center; gap:10px; width:100%; border:none; background:none; cursor:pointer; text-align:left; padding:10px 14px; border-bottom:1px solid var(--separator); font-size:14px}
.match:last-child{border-bottom:none}
.match:hover{background:var(--fill)}
.match .m-main{flex:1; min-width:0}
.match .m-sub{display:block; color:var(--label-2); font-size:12.5px}
.match .chev{width:16px; height:16px}
.boxnote{padding:11px 14px; color:var(--label-3); font-size:13px}
.nextrow{display:flex; align-items:center; gap:6px; flex-wrap:wrap; padding:10px 14px; border-bottom:1px solid var(--separator)}
.nextrow .lbl{font-size:13px; color:var(--label-2); margin-right:2px}
.nextrow .lbl b{color:var(--label); font-weight:600}
.nextrow .lbl b.late{color:var(--red)}
.nextrow .chip{height:28px; font-size:12.5px; padding:0 11px}
.nextrow input{height:28px; border:1px solid var(--separator); border-radius:8px; padding:0 8px; background:var(--surface); font-size:13px}
.logadd{display:flex; gap:6px; padding:10px 14px; border-bottom:1px solid var(--separator)}
.logadd input{flex:1; min-width:0; height:34px; border:1px solid var(--separator); border-radius:9px; padding:0 10px; background:var(--surface)}
.logadd input:focus{outline:none; border-color:var(--tint); box-shadow:0 0 0 3px var(--tint-wash)}
.log{display:flex; gap:10px; padding:9px 14px; border-bottom:1px solid var(--separator); font-size:13.5px}
.log:last-child{border-bottom:none}
.log time{flex:none; color:var(--label-3); font-variant-numeric:tabular-nums; white-space:nowrap; font-size:12.5px; padding-top:1px}
.log span{flex:1; white-space:pre-wrap; word-break:break-word}
.log button{border:none; background:none; color:var(--label-3); cursor:pointer; padding:0 2px; font-size:13px}
.log button:hover{color:var(--red)}
.kv .mini{border:none; background:var(--tint); color:var(--on-tint); border-radius:999px; padding:2px 10px; font-size:12px; font-weight:600; cursor:pointer; margin-left:8px}
.kv dd.late{color:var(--red); font-weight:600}
.kv dd.good{color:var(--green); font-weight:600}
.feehint{font-size:12px; color:var(--label-3); padding:7px 6px 0; line-height:1.45}
.age{display:block; font-size:11.5px; color:var(--label-3); margin-top:2px}
.age.old{color:var(--orange); font-weight:600}
.mcount{display:inline-block; padding:2px 9px; border-radius:999px; background:var(--tint-wash); color:var(--tint-press); font-size:12.5px; font-weight:600; white-space:nowrap}
.mcount.zero{background:var(--fill); color:var(--label-3); font-weight:500}
.stat.is-red dd{color:var(--red)}
.stat.is-blue dd{color:var(--tint)}
@media (max-width:720px){
  .todo{border-radius:14px; margin-bottom:10px}
  .todo-head{padding:11px 14px}
  .todo-item{padding:10px 14px}
  .quickacts .btn{height:42px}
}
@media print{ .todo{display:none !important} }

/* ---------- 구글 계정 · 동기화 ---------- */
.acct{display:flex; align-items:center; gap:6px}
.syncpill{display:inline-flex; align-items:center; gap:6px; height:30px; padding:0 11px; border-radius:999px; background:var(--fill); font-size:12.5px; color:var(--label-2); white-space:nowrap}
.syncpill .sd{width:7px; height:7px; border-radius:50%; background:var(--green); flex:none}
.syncpill.s-saving .sd{background:var(--tint); animation:pulse 1s infinite}
.syncpill.s-loading .sd, .syncpill.s-offline .sd{background:var(--orange)}
.syncpill.s-loading .sd{animation:pulse 1s infinite}
.syncpill.s-error{color:var(--red)}
.syncpill.s-error .sd{background:var(--red)}
@keyframes pulse{50%{opacity:.25}}
.avatar{width:32px; height:32px; border-radius:50%; border:none; padding:0; cursor:pointer; background:var(--tint); color:#fff; font-weight:600; font-size:14px; overflow:hidden; display:inline-flex; align-items:center; justify-content:center; flex:none}
.avatar img{width:100%; height:100%; object-fit:cover}
.btn.gbtn{background:var(--surface); border:1px solid var(--separator-firm)}
.btn.gbtn:hover{background:var(--surface-2)}
svg.g{width:16px; height:16px; stroke:none}
.acctmenu{position:fixed; top:58px; right:16px; z-index:70; width:min(290px, calc(100vw - 32px)); background:var(--surface); border:1px solid var(--separator); border-radius:var(--r-lg); box-shadow:var(--shadow-3); padding:14px}
.acctmenu .who{display:flex; gap:10px; align-items:center; padding-bottom:12px; border-bottom:1px solid var(--separator)}
.acctmenu .who .avatar{width:40px; height:40px; cursor:default; color:#fff; font-size:16px}
.acctmenu .who b{display:block; font-size:14.5px; font-weight:600}
.acctmenu .who span{font-size:12.5px; color:var(--label-2); word-break:break-all}
.acctmenu p{font-size:12.5px; color:var(--label-2); padding:10px 2px 12px; line-height:1.55}
.acctmenu .btn{width:100%}
.loginbar{display:flex; align-items:center; gap:10px; flex-wrap:wrap; background:var(--tint-wash); border-radius:var(--r-md); padding:11px 14px; margin-bottom:12px; font-size:13.5px; color:var(--tint-press)}
.loginbar svg{width:17px; height:17px; flex:none}
.loginbar b{font-weight:600}
.loginbar .acts{display:flex; gap:6px; margin-left:auto}
.loginbar .btn{height:30px; font-size:13px}
.loginbar .btn.later{background:rgba(255,255,255,.7); color:var(--tint-press)}
@media (max-width:720px){
  .syncpill{padding:0 9px; height:32px}
  .syncpill .t{display:none}
  .loginbar{padding:9px 12px; font-size:12.5px; margin-bottom:10px}
  .loginbar .acts{margin-left:auto}
  .acctmenu{top:auto; bottom:calc(16px + env(safe-area-inset-bottom)); right:16px}
}
@media print{ .acct,.acctmenu,.loginbar{display:none !important} }

</style>
</head>
<body>

<!-- ───────── 상단 바 ───────── -->
<header class="topbar">
  <div class="topbar-inner">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.6 12 3.5l9 7.1V20a1 1 0 0 1-1 1h-5.2v-6.1H9.2V21H4a1 1 0 0 1-1-1z"/></svg>
      <span class="brand-text"><b>신흥 부동산</b><i>매물 장부</i></span>
    </div>

    <div class="seg" role="tablist" aria-label="장부 선택">
      <span class="seg-thumb" aria-hidden="true"></span>
      <button class="seg-btn" role="tab" id="tabL" aria-selected="true">매물</button>
      <button class="seg-btn" role="tab" id="tabC" aria-selected="false">손님</button>
    </div>

    <div class="top-actions">
      <span class="saved" id="savedTag" aria-live="polite"></span>
      <span class="acct" id="acct"></span>
      <button class="btn" id="btnImport">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 15.5V4m0 11.5-3.6-3.6M12 15.5l3.6-3.6M4.5 16v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
        <span>엑셀 열기</span>
      </button>
      <button class="btn" id="btnExport">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11.5m0-11.5L8.4 7.6M12 4l3.6 3.6M4.5 16v2.5a1.5 1.5 0 0 0 1.5 1.5h12a1.5 1.5 0 0 0 1.5-1.5V16"/></svg>
        <span id="saveLabel">엑셀 저장</span>
      </button>
      <button class="btn primary" id="btnAdd">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5.5v13M5.5 12h13"/></svg>
        <span id="addLabel">매물 등록</span>
      </button>
    </div>
  </div>
</header>

<div class="layout">

  <!-- ───────── 사이드바 ───────── -->
  <aside class="sidebar">
    <h2 class="side-title" id="railTitle">매물 종류</h2>
    <nav class="side-list" id="rail" aria-label="종류 필터"></nav>

    <h2 class="side-title spaced">한눈에</h2>
    <dl class="stats" id="stats"></dl>
  </aside>

  <!-- ───────── 목록 ───────── -->
  <main class="main">
    <div id="loginBar"></div>
    <div id="todoBox"></div>
    <div id="fileBar"></div>
    <div id="draftBar"></div>
    <div id="demoNote"></div>

    <div class="toolbar">
      <div class="searchwrap">
        <svg class="search-ico" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.2"/><path d="m15.6 15.6 4 4"/></svg>
        <input class="search" id="q" type="search" placeholder="지역·건물명·의뢰인·메모 검색" autocomplete="off">
        <kbd class="kbd" id="kbdHint">⌘K</kbd>
      </div>
      <div class="filters">
        <div class="chips" id="dealChips"></div>
        <span class="chip-div" aria-hidden="true"></span>
        <div class="chips" id="statusChips"></div>
        <button class="btn quiet hidden" id="btnReset">필터 해제</button>
        <label class="sortwrap">
          <span class="sr-only">정렬</span>
          <select id="sort">
            <option value="date">최근 등록순</option>
            <option value="price-desc">금액 높은순</option>
            <option value="price-asc">금액 낮은순</option>
            <option value="area">지역명순</option>
          </select>
        </label>
      </div>
    </div>

    <p class="resultline" id="resultLine"></p>
    <section class="card" id="listCard"></section>
  </main>
</div>

<!-- ───────── 상세 패널 ───────── -->
<div class="scrim" id="scrim" hidden></div>
<aside class="detail closed" id="detail" aria-hidden="true" aria-label="상세 정보">
  <div class="detail-head">
    <button class="btn icon-btn quiet" id="dClose" aria-label="닫기">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6.5 6.5 11 11m0-11-11 11"/></svg>
    </button>
    <div class="detail-title">
      <h3 id="dTitle">—</h3>
      <p id="dSub"></p>
    </div>
  </div>
  <div class="detail-body" id="dBody"></div>
  <div class="detail-foot">
    <button class="btn" id="dDup">복제</button>
    <button class="btn" id="dEdit">수정</button>
    <button class="btn destructive" id="dDel">삭제</button>
